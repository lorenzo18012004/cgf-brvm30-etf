name: Rattrapage rapport matinal (7h UTC)

on:
  schedule:
    - cron: '0 7 * * 2-6'   # mar–sam 7h UTC → rattrapage lun–ven J-1
  workflow_dispatch:

jobs:
  catchup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Vérifier si le rapport de la veille existe
        id: check
        run: |
          # Dernier jour ouvré (remonter si week-end)
          CANDIDATE=$(date -u -d "yesterday" +%Y-%m-%d)
          DOW=$(date -u -d "yesterday" +%u)
          if [ "$DOW" -eq 6 ]; then
            CANDIDATE=$(date -u -d "2 days ago" +%Y-%m-%d)
          elif [ "$DOW" -eq 7 ]; then
            CANDIDATE=$(date -u -d "3 days ago" +%Y-%m-%d)
          fi

          YEAR=$(echo $CANDIDATE | cut -d- -f1)
          YM=$(echo $CANDIDATE | cut -d- -f1,2)
          PDF="data/pdfs/journalier/${YEAR}/${YM}/rapport_journalier_${CANDIDATE}.pdf"

          echo "target_date=$CANDIDATE" >> $GITHUB_OUTPUT

          if [ -f "$PDF" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "[OK] Rapport ${CANDIDATE} déjà présent — rien à faire."
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "[MANQUANT] Rapport ${CANDIDATE} absent — rattrapage lancé."
          fi

      - name: Setup Python
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/requirements_cloud.txt

      - name: Installer dépendances
        if: steps.check.outputs.needed == 'true'
        run: pip install -r requirements/requirements_cloud.txt

      - name: Mettre à jour les prix de clôture
        if: steps.check.outputs.needed == 'true'
        run: python scripts/scrape_sika_history.py

      - name: Recalculer la NAV
        if: steps.check.outputs.needed == 'true'
        run: python scripts/calc_nav_cloud.py

      - name: Mettre à jour brvm30_index_history
        if: steps.check.outputs.needed == 'true'
        run: python scripts/update_brvm30_history.py

      - name: Générer le rapport manquant
        if: steps.check.outputs.needed == 'true'
        run: python scripts/generate_daily_report.py --date "${{ steps.check.outputs.target_date }}" --force

      - name: Envoyer par email
        if: steps.check.outputs.needed == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_report_email.py || true

      - name: Commit & push
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "cgf-bot"
          git config user.email "bot@cgf-bourse.ci"
          git add \
            data/sika_history.json \
            data/nav_latest.json \
            data/brvm30_index_history.json \
            "data/pdfs/journalier/"
          if git diff --cached --quiet; then
            echo "[SKIP] Aucune modification à commiter."
          else
            git commit -m "data: rapport manquant ${{ steps.check.outputs.target_date }} (rattrapage 7h)"
            git pull --rebase origin main
            git push origin main
          fi
